id:
  type: text
  comment: Unique identifier for the section which can be used as an anchor link.
imageSource:
  type: image
  comment: Fallback / poster image for the banner.
  options:
    paths:
      uploads: src/assets/images
      static: ""
imageAlt:
  type: textarea
  comment: Alternative text for the background image.
videoSource:
  type: text
  comment: Optional looping background video path under /public (e.g. /videos/ccelect/hero-loop.mp4).
videoIntroSource:
  type: text
  comment: Optional one-shot intro video played once before the looping videoSource (e.g. /videos/ccelect/hero-ignition-intro.mp4).
scrollMask:
  type: switch
  comment: Pin the banner while scrolling and shrink the media into a rounded window.
heading:
  type: markdown
  comment: Heading text shown over the banner. Use a line break for two lines.
subtext:
  type: textarea
  comment: Short supporting description shown beneath the heading.
buttonSections:
  type: array
  comment: Call-to-action buttons under the copy.
  options:
    structures: _structures.buttonSections
